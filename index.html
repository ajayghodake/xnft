<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFT Preview Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="Main">
    <main class="card">
      <div class="card__images" tabindex="0">
        <img src="assets/Floating Neon Prismatic Cube.png" alt="Equilibrium #3429 NFT artwork" />
        <div class="card__images-layer">
          <img src="assets/icon-view.svg" alt="" class="card__view-icon" />
        </div>
      </div>

      <div class="card__title">
        <h1>Equilibrium #3429</h1>
      </div>
      
      <div id="info">Our Equilibrium collection promotes balance and calm.</div>

      <div class="card__time">
        <div class="card__time-left">
          <img src="assets/icon-ethereum.svg" alt="equilibrium-icon" class="equilibrium-icon" />
          <span>0.041 ETH</span>
        </div>
        <div class="card__time-right">
          <img src="assets/icon-clock.svg" alt="clock_icon" class="clock_icon" />
          <span>3 days left</span>
        </div>
      </div>

      <div class="card__creator">
        <img class="avatar_img" src="assets/profile-pic.png" alt="Ajay Ghodake" />
        <p>Creation of &nbsp; <span>Ajay Ghodake</span></p>
      </div>
    </main>

    <footer class="attribution">
      <p>
        Challenge by &nbsp;
        <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">Crio.Do</a>
        &nbsp; Coded by &nbsp;
        <a href="https://www.github.com/ajayghodake" target="_blank" rel="noopener noreferrer">Ajay Ghodake</a>
      </p>
    </footer>
  </div>
</body>
</html>
